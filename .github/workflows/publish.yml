name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # OIDC trusted publishing (token-less, like n8n)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish to npm (skip if this version is already there)
        # The two publish targets (npm + MCP Registry) run in one job and were
        # not idempotent before: when npm succeeded and the registry failed, a
        # re-run was IMPOSSIBLE, because npm said "cannot publish over" and the
        # flow never reached the registry step. The August 4 and August 21 runs
        # were left half done silently in exactly this way. Skip when the
        # version is already published, so the other half can complete.
        run: |
          V=$(node -p "require('./package.json').version")
          N=$(node -p "require('./package.json').name")
          if npm view "$N@$V" version >/dev/null 2>&1; then
            echo "npm: $N@$V is already published, skipping"
          else
            npm publish --provenance --access public --tag latest
          fi
      - name: Sync server.json version from package.json
        # server.json's own `version` field was a second copy: nobody bumped it
        # in the 2.5.0 release, the MCP registry refused with "cannot publish
        # duplicate version" and the entry stayed at 2.4.0, so while npm
        # published, the registry fell behind silently. The version is now
        # derived from ONE place.
        run: |
          node -e "
            const fs = require('fs');
            const v = require('./package.json').version;
            const s = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            s.version = v;
            for (const p of s.packages ?? []) {
              if (p.identifier === '@sudomock/mcp') p.version = v;
            }
            fs.writeFileSync('server.json', JSON.stringify(s, null, 2) + '\n');
            console.log('server.json version ->', v);
          "
      - name: Install mcp-publisher
        run: curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Wait for npm to serve the version the registry will look for
        # Before accepting an entry, the registry asks npm whether it can see
        # the version. Right after a publish npm says "may take a few minutes
        # to become available", so asking at once returns 404 and the registry
        # refuses with 400: the 2.10.0 run failed exactly this way. First see
        # npm actually serve the version, then register it.
        run: |
          V=$(node -p "require('./package.json').version")
          N=$(node -p "require('./package.json').name")
          for i in $(seq 1 30); do
            if npm view "$N@$V" version >/dev/null 2>&1; then
              echo "npm: $N@$V is being served ($((i*10))s)"
              exit 0
            fi
            sleep 10
          done
          echo "npm: $N@$V did not appear within 5 minutes; the registry step will still be attempted"
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          # The exit code is read from the publish, NOT from `tee`: a pipeline's
          # code belongs to its last command and `tee` always succeeds, so the
          # old version printed "published" and left the job green even when
          # the publish failed. The 2.10.0 run looked successful in exactly this
          # way despite getting 400. A version already in the registry is not
          # an error but finished work: a "duplicate version" result counts as
          # success.
          set +e
          ./mcp-publisher publish >/tmp/mcp-publish.log 2>&1
          code=$?
          set -e
          cat /tmp/mcp-publish.log
          if [ "$code" -eq 0 ]; then
            echo "MCP Registry: published"
          elif grep -q "duplicate version" /tmp/mcp-publish.log; then
            echo "MCP Registry: this version is already registered, skipping"
          else
            exit "$code"
          fi

      # =================================================================
      # PUBLISH THE TOOL MANIFEST
      #
      # The catalogue the dashboard and the documentation render used to be a
      # hand-kept copy of this tool list. It drifted badly: eight tools that had
      # never existed here were advertised, eighteen real ones were missing, and
      # the agent setup instructions told clients to call two tools that are not
      # here. The test that should have caught it compared one copy to another.
      #
      # Publishing the manifest the protocol itself reports removes the copy.
      # Allowed to fail: a bucket that cannot be reached must not fail a release
      # that npm and the registry already accepted.
      # =================================================================

      - name: Publish the tool manifest
        if: success()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          # R2 rejects every real AWS region name.
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "R2 credentials are not configured; skipping the manifest publish."
            exit 0
          fi

          npm run manifest

          COUNT=$(node -p "require('./manifest.json').tools.length")
          if [ "$COUNT" -lt 1 ]; then
            echo "The manifest carries no tools; refusing to publish it."
            exit 1
          fi

          aws s3 cp manifest.json s3://sudomock-assets/mcp-manifest.json \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "public, max-age=300, stale-while-revalidate=86400"

          echo "Published $COUNT tools to https://assets.sudomock.com/mcp-manifest.json"
