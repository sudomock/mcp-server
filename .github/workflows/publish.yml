name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # OIDC trusted publishing (token-less, like n8n)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish to npm (skip if this version is already there)
        # Iki yayin hedefi (npm + MCP Registry) tek iste kosuyor ve daha once
        # idempotent degildi: npm basarili olup registry duserse, yeniden kosmak
        # IMKANSIZ hale geliyordu -- npm "cannot publish over" diyip akisi
        # registry adimina hic vardirmiyordu. 4 Agustos ve 21 Agustos kosulari
        # tam olarak boyle sessizce yarim kaldi. Surum zaten yayindaysa atla,
        # boylece diger yarim tamamlanabilsin.
        run: |
          V=$(node -p "require('./package.json').version")
          N=$(node -p "require('./package.json').name")
          if npm view "$N@$V" version >/dev/null 2>&1; then
            echo "npm: $N@$V zaten yayinda, atlaniyor"
          else
            npm publish --provenance --access public --tag latest
          fi
      - name: Sync server.json version from package.json
        # server.json'un kendi `version` alani ikinci bir kopyaydi: 2.5.0
        # sevkinde kimse yukseltmedi, MCP registry "cannot publish duplicate
        # version" ile reddetti ve kayit 2.4.0'da kaldi -- npm yayinlanirken
        # registry sessizce geride kaliyordu. Surum artik TEK yerden turetiliyor.
        run: |
          node -e "
            const fs = require('fs');
            const v = require('./package.json').version;
            const s = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            s.version = v;
            for (const p of s.packages ?? []) {
              if (p.identifier === '@sudomock/mcp') p.version = v;
            }
            fs.writeFileSync('server.json', JSON.stringify(s, null, 2) + '\n');
            console.log('server.json version ->', v);
          "
      - name: Install mcp-publisher
        run: curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Wait for npm to serve the version the registry will look for
        # Registry, kaydi kabul etmeden once npm'e sorup surumu goruyor mu diye
        # bakiyor. npm yayindan sonra "may take a few minutes to become
        # available" diyor, yani hemen sormak 404 getiriyor ve kayit 400 ile
        # reddediliyor: 2.10.0 kosusu tam olarak boyle dustu. Once npm'in
        # gercekten servis ettigini gor, sonra kaydet.
        run: |
          V=$(node -p "require('./package.json').version")
          N=$(node -p "require('./package.json').name")
          for i in $(seq 1 30); do
            if npm view "$N@$V" version >/dev/null 2>&1; then
              echo "npm: $N@$V servis ediliyor ($((i*10))s)"
              exit 0
            fi
            sleep 10
          done
          echo "npm: $N@$V 5 dakikada gorunmedi, kayit adimi yine de denenecek"
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          # Cikis kodu yayindan okunur, `tee`'den DEGIL: bir boru hattinin kodu
          # son komuta aittir ve `tee` her zaman basarili olur, yani eski hali
          # yayin dusse de "yayinlandi" yazip isi yesil birakiyordu. 2.10.0
          # kosusu 400 aldigi halde tam olarak boyle basarili gorundu.
          # Surum registry'de zaten varsa bu bir hata degil, tamamlanmis bir
          # istir: "duplicate version" cikisi basari sayilir.
          set +e
          ./mcp-publisher publish >/tmp/mcp-publish.log 2>&1
          code=$?
          set -e
          cat /tmp/mcp-publish.log
          if [ "$code" -eq 0 ]; then
            echo "MCP Registry: yayinlandi"
          elif grep -q "duplicate version" /tmp/mcp-publish.log; then
            echo "MCP Registry: bu surum zaten kayitli, atlaniyor"
          else
            exit "$code"
          fi
